# Grafana datasource provisioning.
#
# Deployed to /etc/grafana/provisioning/datasources/prometheus.yml on MON01.
# Grafana reads this at start-up whether it runs as a package or a container.
#
#   sudo cp .../prometheus.yml /etc/grafana/provisioning/datasources/
#   sudo systemctl restart grafana-server

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    # Provisioned datasources should not be editable in the UI: the repository
    # is the source of truth, and a change made by clicking is a change nobody
    # can review or reproduce.
    editable: false
    jsonData:
      timeInterval: 30s
