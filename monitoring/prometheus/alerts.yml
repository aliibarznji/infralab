groups:
  - name: infrastructure
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} is down"
          description: "Prometheus job {{ $labels.job }} cannot reach {{ $labels.instance }}. Either the host is down or its exporter has stopped."

      - alert: DiskSpaceLow
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is over 85% full"
          description: "Linux filesystem usage crossed the warning threshold. Investigate before it reaches 95%."

      - alert: DiskSpaceCritical
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay"} * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is over 95% full"
          description: "Failure is imminent. Reclaim space now."

      - alert: WindowsDiskSpaceLow
        expr: 100 - (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.volume }} on {{ $labels.instance }} is over 85% full"
          description: "Windows volume usage crossed the warning threshold."

      - alert: WindowsDiskSpaceCritical
        expr: 100 - (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Volume {{ $labels.volume }} on {{ $labels.instance }} is over 95% full"
          description: "Failure is imminent. On a domain controller a full system volume can damage the AD database."

      - alert: WindowsServiceDown
        expr: windows_service_state{name=~"NTDS|DNS|DHCPServer|Netlogon",state="running"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Windows service {{ $labels.name }} is not running on {{ $labels.instance }}"
          description: "Service {{ $labels.name }} left the running state. Domain services depend on it."

      # Added after INC-004. windows_exporter on this build does not expose an
      # actual clock-offset metric, only the NTP round-trip delay, which is a
      # network-latency figure and not a direct measure of drift. A host whose
      # clock has genuinely drifted will not necessarily show a high round-trip
      # delay, and a host on a slow link could trip this with no drift at all.
      # Kept as an imperfect early-warning signal, not a substitute for a real
      # offset check, which this exporter build cannot provide.
      - alert: ClockSkewHigh
        expr: windows_time_ntp_round_trip_delay_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew signal on {{ $labels.instance }}"
          description: "NTP round-trip delay exceeds 5 minutes. This is a proxy for clock drift, not a direct offset measurement — verify with w32tm /query /status before treating it as confirmed skew. Skew past the domain's Kerberos tolerance can break authentication in a way that presents as a permissions problem rather than a time problem."

  - name: probes
    rules:
      # INC-001: stopping the DNS service did not look like an outage from
      # outside. ICMP still answered and short names still resolved through
      # NetBIOS/LLMNR fallback. This probe asks for the SOA record and fails
      # when the server cannot answer, which is the signal that was missing.
      - alert: DNSProbeFailed
        expr: probe_success{job="blackbox_dns"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "DNS server {{ $labels.instance }} is not answering for lab.local"
          description: "The SOA query failed. Domain controller discovery and new authentication will fail while this persists, though existing sessions may continue on cached records and unexpired Kerberos tickets, and short names may still resolve via NetBIOS."

      - alert: TCPProbeFailed
        expr: probe_success{job="blackbox_tcp"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "TCP probe to {{ $labels.instance }} failed"
          description: "The port stopped accepting connections. Note that an open port alone never proved the service works."

      - alert: ICMPProbeFailed
        expr: probe_success{job="blackbox_icmp"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not responding to ICMP"
          description: "The host is unreachable on the lab segment."

  - name: backup
    rules:
      # The most important rule here: it fires when backups have quietly stopped
      # and nobody has noticed. 25 hours, not 24, so a daily job running a few
      # minutes late does not alert every single day.
      - alert: BackupStale
        expr: time() - infralab_backup_last_success_timestamp_seconds > 25 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup on {{ $labels.instance }} in over 25 hours"
          description: "The backup job has not recorded a success within the 25 hour threshold. Check root's crontab on BKP01 and the CIFS mount at /mnt/dc01-share."

      - alert: BackupFailed
        expr: infralab_backup_last_run_exit_code != 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The most recent backup run failed on {{ $labels.instance }}"
          description: "backup-dc01.sh exited non-zero. Check its cron output and /var/log/syslog on BKP01."

      - alert: BackupMountMissing
        expr: infralab_backup_mount_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The CompanyShare CIFS mount was unavailable at backup time on {{ $labels.instance }}"
          description: "An unmounted CIFS mountpoint is an empty directory, and backing it up would produce a valid but empty snapshot. The job refused to run rather than create one."

      - alert: BackupSnapshotCountDropped
        expr: delta(infralab_backup_snapshot_count[2h]) < -1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Snapshot count on {{ $labels.instance }} fell by more than one"
          description: "Retention removes at most one snapshot per daily run under the current policy. A larger drop suggests forget/prune removed more than intended, or the repository was modified outside the job."

      - alert: RestoreTestFailed
        expr: infralab_restore_test_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Restore verification failed on {{ $labels.instance }}"
          description: "The most recent restore test did not match the live share. A backup that cannot be restored is not a backup. Run verify-restore.sh by hand and read its diff output."

      - alert: RestoreTestStale
        expr: time() - infralab_restore_test_last_success_timestamp_seconds > 8 * 24 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No passing restore test on {{ $labels.instance }} in over 8 days"
          description: "The weekly restore verification has not passed. Backups are unproven until it does."
