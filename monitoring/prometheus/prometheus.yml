# Prometheus scrape configuration — MON01
#
# Deployed to /etc/prometheus/prometheus.yml on MON01, where Prometheus runs as
# a native systemd service (not a container).
#
# Reload after editing, rather than restarting:
#   promtool check config /etc/prometheus/prometheus.yml
#   sudo systemctl reload prometheus

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    lab: infralab

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # node_exporter from the distribution package (prometheus-node-exporter).
  # BKP01's instance also serves the backup metrics written by backup-dc01.sh
  # into the textfile collector directory.
  - job_name: node
    static_configs:
      - targets: ['192.168.56.20:9100']
        labels:
          host: MON01
      - targets: ['192.168.56.30:9100']
        labels:
          host: BKP01

  - job_name: windows
    static_configs:
      - targets: ['192.168.56.10:9182']
        labels:
          host: DC01

  # Blackbox probes. INC-001 showed that a stopped DNS service stayed partly
  # hidden: ICMP still answered and short-name lookups fell through to
  # NetBIOS/LLMNR, so the outage looked like it was not happening. A DNS probe
  # asks the server an actual question and fails when it cannot answer.
  - job_name: blackbox_dns
    metrics_path: /probe
    params:
      module: [dns_soa]
    static_configs:
      - targets:
          - 192.168.56.10
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 192.168.56.10:53      # DNS
          - 192.168.56.10:445     # SMB
          - 192.168.56.10:88      # Kerberos
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 192.168.56.10
          - 192.168.56.30
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
